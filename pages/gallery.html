<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | My Next Level</title>
    <meta name="description" content="Gallery page for My Next Level community and outreach images." />
    <link rel="stylesheet" href="../styles/index.css" />
</head>
<body>
    <site-header></site-header>

    <main>
        <section aria-labelledby="gallery-page-heading">
            <p>Gallery</p>
            <h1 id="gallery-page-heading">A glimpse into community work and support.</h1>
            <p>[Gallery introduction placeholder.]</p>
        </section>

        <section aria-label="Photo gallery">
            <div class="gallery-grid">
                <figure>
                    <img src="../assets/images/gallery-1.jpg" alt="Placeholder gallery image one." />
                    <figcaption>Community support activity</figcaption>
                </figure>
                <figure>
                    <img src="../assets/images/gallery-2.jpg" alt="Placeholder gallery image two." />
                    <figcaption>Volunteer engagement</figcaption>
                </figure>
                <figure>
                    <img src="../assets/images/gallery-3.jpg" alt="Placeholder gallery image three." />
                    <figcaption>Outreach event</figcaption>
                </figure>
                <figure>
                    <img src="../assets/images/gallery-4.jpg" alt="Placeholder gallery image four." />
                    <figcaption>Care and community connection</figcaption>
                </figure>
                <figure>
                    <img src="../assets/images/gallery-5.jpg" alt="Placeholder gallery image five." />
                    <figcaption>Programme participation</figcaption>
                </figure>
                <figure>
                    <img src="../assets/images/gallery-6.jpg" alt="Placeholder gallery image six." />
                    <figcaption>Community support moment</figcaption>
                </figure>
            </div>
        </section>

        <section aria-labelledby="gallery-empty-heading">
            <h2 id="gallery-empty-heading">No gallery images yet</h2>
            <p>This section is reserved for future gallery uploads and photo collections.</p>
        </section>
    </main>

    <site-footer></site-footer>
    <script src="../components.js"></script>
</body>
</html>
